  <defs>
    <radialGradient id="crtGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#001a33" stop-opacity="0" />
      <stop offset="100%" stop-color="#000a1a" stop-opacity="0.7" />
    </radialGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e" />
      <stop offset="60%" stop-color="#0d2247" />
      <stop offset="100%" stop-color="#0a3a5c" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a4a7a" />
      <stop offset="100%" stop-color="#021525" />
    </linearGradient>
    <linearGradient id="hullGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e8e8" />
      <stop offset="50%" stop-color="#c8c8c8" />
      <stop offset="100%" stop-color="#d44040" />
    </linearGradient>
    <filter id="crtScan">
      <feTurbulence type="fractalNoise" baseFrequency="0 0.5" numOctaves="1" result="noise" />
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise" />
      <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend" />
      <feComposite in="blend" in2="SourceGraphic" operator="in" />
    </filter>
    
    <pattern id="scanlines" x="0" y="0" width="2" height="4" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="black" fill-opacity="0.08" />
    </pattern>
  </defs>

  
